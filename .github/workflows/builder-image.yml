name: Build cross-compile image
# Builds builder/Containerfile and pushes two images to this repository owner's GHCR namespace:
#   jssc-cross      all toolchains, no Apple SDK (fine to make public)
#   jssc-cross-sdk  jssc-cross + MacOSX11.3.sdk; Apple's license forbids redistributing the SDK,
#                   so this package must stay private
# Run it only to change a toolchain on purpose, then point cross-compile.yml at the new digest.
on: workflow_dispatch

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The ten dockcross source images alone take ~19 GB unpacked
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          docker system prune --all --force
          df -h /

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          tag=$(date -u +%Y%m%d)-$(git rev-parse --short HEAD)
          for image in jssc-cross jssc-cross-sdk; do
            docker build --target "$image" \
              --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
              --label org.opencontainers.image.revision=${{ github.sha }} \
              -t "ghcr.io/$owner/$image:$tag" builder
            docker push "ghcr.io/$owner/$image:$tag"
            echo "$image: $(docker inspect --format '{{index .RepoDigests 0}}' "ghcr.io/$owner/$image:$tag")" | tee -a "$GITHUB_STEP_SUMMARY"
          done
