name: macOS natives on Linux (zig)
# Cross-compiles osx_64 and osx_arm64 on Linux with zig (toolchain/MacosZig.cmake) in the builder/macos-zig
# image, against the same SDKs the macOS runners use (MacOSX10.9.sdk and MacOSX11.0.sdk from
# phracker/MacOSX-SDKs, checked against their SHA-256), then checks each library against the precompiled
# one and runs the test suite with it on a real Mac.
on:
  workflow_dispatch:
  # workflow_dispatch needs the workflow on the default branch; until then a push to these branches runs it
  push:
    branches:
      - 'osxcross-plan-*'

env:
  MAVEN_OPTS: -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn
  SDK_URL: https://github.com/phracker/MacOSX-SDKs/releases/download/11.3

jobs:
  # The image holds no Apple SDK; it is built once per change of builder/macos-zig and reused by digest
  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      ref: ${{ steps.image.outputs.ref }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - id: image
        name: Build the image, unless this Containerfile was built before
        run: |
          name=ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/jssc-macos-zig
          tag=$(echo "${{ hashFiles('builder/macos-zig/**') }}" | cut -c1-16)
          if docker buildx imagetools inspect "$name:$tag" > /dev/null 2>&1; then
            echo "Reusing $name:$tag"
          else
            docker build --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
              -f builder/macos-zig/Containerfile -t "$name:$tag" builder/macos-zig
            docker push "$name:$tag"
          fi
          digest=$(docker buildx imagetools inspect "$name:$tag" | awk '$1 == "Digest:" { print $2; exit }')
          echo "ref=$name@$digest" | tee -a "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-24.04
    needs: image
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # zig links against .tbd library stubs only; the 10.9 SDK has Mach-O stubs, which macos-sdk-tbd converts
          - target: osx_64
            os-target-arch: x86_64
            macos-arch: x86_64
            macos-deployment-target: '10.9'
            sdk: MacOSX10.9.sdk
            sdk-version: '10.9'
            sdk-sha256: fcf88ce8ff0dd3248b97f4eb81c7909f2cc786725de277f4d05a2b935cc49de0
            convert-sdk: true

          - target: osx_arm64
            os-target-arch: aarch_64
            macos-arch: arm64
            macos-deployment-target: '11.0'
            sdk: MacOSX11.0.sdk
            sdk-version: '11.0'
            sdk-sha256: d3feee3ef9c6016b526e1901013f264467bb927865a03422a9cb925991cc9783
            convert-sdk: false
    steps:
      - uses: actions/checkout@v4

      # Never part of an image, only of this repository's Actions cache
      - id: sdk-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/sdk/${{ matrix.sdk }}
          key: macos-sdk-${{ matrix.sdk-sha256 }}

      - name: Get ${{ matrix.sdk }}
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/sdk"
          curl -fsSL -o "$RUNNER_TEMP/sdk.tar.xz" "$SDK_URL/${{ matrix.sdk }}.tar.xz"
          echo "${{ matrix.sdk-sha256 }}  $RUNNER_TEMP/sdk.tar.xz" | sha256sum -c
          tar -xJf "$RUNNER_TEMP/sdk.tar.xz" -C "$RUNNER_TEMP/sdk"
          rm "$RUNNER_TEMP/sdk.tar.xz"

      - name: Pull the builder image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull "${{ needs.image.outputs.ref }}"

      - name: Build ${{ matrix.target }}
        run: |
          mkdir -p "$RUNNER_TEMP/sdk-tbd"
          docker run --rm --workdir=/work \
            --env JSSC_BUILD_REV=$(git rev-parse --short HEAD) \
            --volume "$PWD:/work" \
            --volume "$HOME/.m2:/root/.m2" \
            --volume "$RUNNER_TEMP/sdk:/sdk:ro" \
            --volume "$RUNNER_TEMP/sdk-tbd:/sdk-tbd" \
            --env MAVEN_OPTS \
            --env MACOS_SDK=${{ matrix.convert-sdk && '/sdk-tbd' || '/sdk' }}/${{ matrix.sdk }} \
            --env MACOS_ARCH=${{ matrix.macos-arch }} \
            --env MACOSX_DEPLOYMENT_TARGET=${{ matrix.macos-deployment-target }} \
            "${{ needs.image.outputs.ref }}" \
            bash -c '
              set -e
              if [ "${{ matrix.convert-sdk }}" = true ]; then macos-sdk-tbd /sdk/${{ matrix.sdk }} /sdk-tbd/${{ matrix.sdk }}; fi
              zig version
              mvn -B clean install -P macos-zig \
                -Dos.target.arch=${{ matrix.os-target-arch }} \
                -Djssc.build.rev=$JSSC_BUILD_REV \
                -Djssc.build.origin=${{ github.repository }}'

      - uses: actions/upload-artifact@v4
        with:
          name: natives-${{ matrix.target }}
          path: target/cmake/natives/${{ matrix.target }}/libjssc.dylib
          if-no-files-found: error

      - name: Compare with the precompiled ${{ matrix.target }}
        run: |
          docker run --rm --workdir=/work --volume "$PWD:/work" "${{ needs.image.outputs.ref }}" \
            bash .github/scripts/check-macos-native.sh \
              target/cmake/natives/${{ matrix.target }}/libjssc.dylib \
              src/main/resources-precompiled/natives/${{ matrix.target }}/libjssc.dylib \
              ${{ matrix.macos-arch }} ${{ matrix.macos-deployment-target }} ${{ matrix.sdk-version }} \
            | tee -a "$GITHUB_STEP_SUMMARY"

  # Loads the cross-built library on a Mac and runs the whole test suite with it
  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: osx_64
            runner: macos-15-intel
            profile: x86_64
          - target: osx_arm64
            runner: macos-15
            profile: aarch64
          # Another pool of Apple silicon runners, for when macos-15 has none to spare
          - target: osx_arm64
            runner: macos-26
            profile: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 11
          distribution: temurin
      - run: brew install socat

      - uses: actions/download-artifact@v4
        with:
          name: natives-${{ matrix.target }}
          path: cross-built

      - name: Use the cross-built ${{ matrix.target }} as the precompiled one
        run: |
          lib=cross-built/libjssc.dylib
          grep -a -o 'JSSC-IDENT [[:print:]]*' "$lib"
          otool -hv "$lib"
          otool -l "$lib" | grep -A4 -E 'LC_VERSION_MIN_MACOSX|LC_BUILD_VERSION'
          otool -L "$lib"
          codesign -dv "$lib" || true
          if [ "${{ matrix.target }}" = osx_arm64 ]; then codesign --verify --verbose "$lib"; fi
          cp "$lib" src/main/resources-precompiled/natives/${{ matrix.target }}/libjssc.dylib

      # No native build: the tests load the library from the classpath, i.e. the cross-built one
      - name: Run the tests with it
        run: |
          sw_vers
          mvn -B test -P ${{ matrix.profile }} -Dcmake.generate.skip=true -Dcmake.build.skip=true -Djavah.skip=true
          cmp target/classes/natives/${{ matrix.target }}/libjssc.dylib cross-built/libjssc.dylib
