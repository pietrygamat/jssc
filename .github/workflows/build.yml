name: build

on:
  push:
  pull_request:
  # Lets env-canary.yml run the same matrix on the runner images that will replace the pinned ones
  workflow_call:
    inputs:
      ubuntu-runner:
        type: string
        required: false
      macos-runner:
        type: string
        required: false
      windows-runner:
        type: string
        required: false

env:
  MAVEN_OPTS: -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn

# Runner images are pinned: a floating "-latest" label changes compilers, headers and SDKs
# underneath us without a commit (#190, #201). env-canary.yml tries the next images weekly.
jobs:
  ubuntu:
    runs-on: ${{ inputs.ubuntu-runner || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: x86
            packages: g++-multilib

          # g++ is preinstalled; it is listed so the leg builds with GCC like the release natives.
          # (It used to say "g++-", which apt reads as "remove g++", so CMake silently fell back to clang.)
          - profile: x86_64
            packages: g++

          - profile: armhf
            packages: g++-arm-linux-gnueabihf

          - profile: aarch64
            packages: g++-aarch64-linux-gnu

          - profile: riscv64
            packages: g++-riscv64-linux-gnu

          - profile: ppc64
            packages: g++-powerpc64le-linux-gnu

          - profile: mingw32
            packages: g++-mingw-w64-i686

          - profile: mingw64
            packages: g++-mingw-w64-x86-64

          - profile: mingwaarch64
            packages: clang
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: 11
          distribution: temurin

      - run: sudo apt-get update && sudo apt-get install --yes socat ${{ matrix.packages }}
      - run: mvn -P "${{ matrix.profile }}" --batch-mode

  macos:
    runs-on: ${{ inputs.macos-runner || 'macos-14' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: aarch64
            macos-deployment-target: 11.0
            sdk-version: MacOSX11.0.sdk
          - profile: x86_64
            macos-deployment-target: 10.9
            sdk-version: MacOSX10.9.sdk

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: 11
          distribution: temurin

      - run: brew install socat

      # Ask the active Xcode for its SDK directory instead of relying on an image-specific
      # variable such as XCODE_16_DEVELOPER_DIR, which disappears when the image drops that Xcode
      - name: Get oldest supported SDK
        run: |
          SDKS_DIR="$(xcrun --show-sdk-platform-path)/Developer/SDKs"
          wget -qO- https://github.com/phracker/MacOSX-SDKs/releases/download/11.3/${{ matrix.sdk-version }}.tar.xz \
            | tar -xjv -C "$SDKS_DIR"
          echo "SDKS_DIR=$SDKS_DIR" >> $GITHUB_ENV

      - name: Set SDK version
        run: |
          export MACOSX_DEPLOYMENT_TARGET=${{ matrix.macos-deployment-target }}
          export SDKROOT=$SDKS_DIR/${{ matrix.sdk-version }}
          export CMAKE_OSX_SYSROOT=$SDKROOT
          echo "MACOSX_DEPLOYMENT_TARGET=$MACOSX_DEPLOYMENT_TARGET" >> $GITHUB_ENV
          echo "SDKROOT=$SDKROOT" >> $GITHUB_ENV
          echo "CMAKE_OSX_SYSROOT=$CMAKE_OSX_SYSROOT" >> $GITHUB_ENV

      - run: mvn -P "${{ matrix.profile }}" --batch-mode

  windows:
    runs-on: ${{ inputs.windows-runner || 'windows-2025' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: aarch64

          - profile: x86_64

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: 11
          distribution: temurin

      - run: mvn -P "${{ matrix.profile }}" --batch-mode
