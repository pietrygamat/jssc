name: build

on:
  push:
  pull_request:
  # Lets env-canary.yml run the same matrix on the runner images that will replace the pinned ones
  workflow_call:
    inputs:
      ubuntu-runner:
        type: string
        required: false
      macos-runner:
        type: string
        required: false
      windows-runner:
        type: string
        required: false

env:
  MAVEN_OPTS: -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn

# Runner images are pinned: a floating "-latest" label changes compilers, headers and SDKs
# underneath us without a commit (#190, #201). env-canary.yml tries the next images weekly.
jobs:
  ubuntu:
    runs-on: ${{ inputs.ubuntu-runner || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: x86
            packages: g++-multilib

          # g++ is preinstalled; it is listed so the leg builds with GCC like the release natives.
          # (It used to say "g++-", which apt reads as "remove g++", so CMake silently fell back to clang.)
          - profile: x86_64
            packages: g++

          - profile: armhf
            packages: g++-arm-linux-gnueabihf

          - profile: aarch64
            packages: g++-aarch64-linux-gnu

          - profile: riscv64
            packages: g++-riscv64-linux-gnu

          - profile: ppc64
            packages: g++-powerpc64le-linux-gnu

          - profile: mingw32
            packages: g++-mingw-w64-i686

          - profile: mingw64
            packages: g++-mingw-w64-x86-64

          - profile: mingwaarch64
            packages: clang
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: 11
          distribution: temurin

      - run: sudo apt-get update && sudo apt-get install --yes socat ${{ matrix.packages }}
      - run: mvn -P "${{ matrix.profile }}" --batch-mode

  # Release natives for macOS are cross-compiled on Linux with osxcross (B-03 direction B, see the
  # osxcross job below). A macOS runner is only needed to run the tests, so it uses the image's own
  # Xcode SDK and needs no old SDK.
  macos:
    runs-on: ${{ inputs.macos-runner || matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: aarch64
            runner: macos-15
          # GitHub's last Intel image; afterwards x86_64 is covered by the osxcross job only
          - profile: x86_64
            runner: macos-15-intel

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: 11
          distribution: temurin

      - run: brew install socat

      - run: mvn -P "${{ matrix.profile }}" --batch-mode

  # The release toolchain for macOS natives (compile only, no tests)
  osxcross:
    runs-on: ${{ inputs.ubuntu-runner || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os-target-arch: x86_64
            osxcross-arch: x86_64
            sdk-version: MacOSX11.0.sdk
            macos-deployment-target: '10.9'
            natives-dir: osx_64
          - os-target-arch: aarch_64
            osxcross-arch: arm64
            sdk-version: MacOSX11.0.sdk
            macos-deployment-target: '11.0'
            natives-dir: osx_arm64

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: 11
          distribution: temurin

      - id: osxcross
        uses: ./.github/actions/setup-osxcross
        with:
          sdk-version: ${{ matrix.sdk-version }}

      - run: mvn -P osxcross -Dos.target.arch=${{ matrix.os-target-arch }} --batch-mode
        env:
          OSXCROSS_TARGET_DIR: ${{ steps.osxcross.outputs.target-dir }}
          OSXCROSS_ARCH: ${{ matrix.osxcross-arch }}
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos-deployment-target }}

      - name: Check deployment target and new imports
        run: >
          OTOOL=$(ls /usr/bin/llvm-otool* | head -1) NM=$(ls /usr/bin/llvm-nm* | head -1)
          .github/scripts/check-macos-dylib.sh
          target/cmake/natives/${{ matrix.natives-dir }}/libjssc.dylib
          ${{ matrix.macos-deployment-target }}
          src/main/resources-precompiled/natives/${{ matrix.natives-dir }}/libjssc.dylib

  windows:
    runs-on: ${{ inputs.windows-runner || 'windows-2025' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: aarch64

          - profile: x86_64

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: 11
          distribution: temurin

      - run: mvn -P "${{ matrix.profile }}" --batch-mode
